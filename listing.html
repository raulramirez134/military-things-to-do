  beaches: `<svg viewBox="0 0 24 24" fill="none" stroke="#D9A24C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20c1.5-2 3.5-2 5 0s3.5 2 5 0 3.5-2 5 0 3.5 2 5 0"/><path d="M12 2v10M8 6l4-4 4 4"/></svg>`,
  onsen: `<svg viewBox="0 0 24 24" fill="none" stroke="#D9A24C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16c1.5-2 3.5-2 5 0s3.5 2 5 0 3.5-2 5 0"/><path d="M8 10c-1-2 0-4 1-5-1 3 1 4 2 3-1 3 1 4 2 2 0 2-1 3-2 3-2 0-3-1-3-3Z"/></svg>`,
  tokyo: `<svg viewBox="0 0 24 24" fill="none" stroke="#D9A24C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l4-4h8l4 4v12"/><path d="M9 21v-6h6v6M4 9h16"/></svg>`,
};

const fieldIcons = {
  address: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`,
  distance: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8 2 5 6 5 10c0 6 7 12 7 12s7-6 7-12c0-4-3-8-7-8Z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
  hours: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
  phoneField: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.4 2.1L8 10.3a16 16 0 0 0 6 6l1.5-1.5a2 2 0 0 1 2-.4c1 .4 2 .6 3 .7a2 2 0 0 1 1.7 2Z"/></svg>`,
};

const params = new URLSearchParams(window.location.search);
const baseKey = BASE_CONFIG[params.get("base")] ? params.get("base") : "ramstein";
const cfg = BASE_CONFIG[baseKey];
const id = params.get("id");

// Update nav links to point at the right base's hub page
document.querySelector(".brand").setAttribute("href", cfg.hub);
document.querySelector(".back-link").setAttribute("href", cfg.hub);
document.querySelector(".back-link").textContent = `← Back to ${cfg.label} listings`;

// Dynamically load the correct base's data file, then run the page
const dataScript = document.createElement("script");
dataScript.src = cfg.dataFile;
dataScript.onload = initPage;
document.body.appendChild(dataScript);

function initPage(){
  const place = places.find(p => p.id === id);
  const fullId = baseKey === "ramstein" ? place?.id : `${baseKey}:${place?.id}`;

  function starGlyphs(rating){
    const full = Math.round(rating);
    let s = "";
    for(let i=1;i<=5;i++) s += i <= full ? "★" : "☆";
    return s;
  }

  function milesFrom(km){ return (km * 0.621371).toFixed(1); }

  if(!place){
    document.getElementById("headerInner").innerHTML = `<h1 class="title">Listing not found</h1>`;
    document.getElementById("mainContent").innerHTML = `<div class="not-found"><p>That listing doesn't exist — it may have been renamed or removed.</p><p><a href="${cfg.hub}">← Back to the full ${cfg.label} list</a></p></div>`;
    return;
  }

  document.title = `${place.name} — Military Things To Do`;

  document.getElementById("metaDescTag").content = `${place.name}: ${place.blurb} Distance from ${cfg.label} ${cfg.refWord}, hours, contact info, and reviews.`;
  document.getElementById("canonicalTag").href = `https://militarythingstodo.com/listing.html?base=${baseKey}&id=${place.id}`;

  document.getElementById("headerInner").innerHTML = `
    <div class="hero-icon" aria-hidden="true">${icons[place.cat] || icons.attraction}</div>
    <div class="header-copy">
      <div class="tag-inline">${catLabels[place.cat]}</div>
      <h1 class="title">${place.name}</h1>
      ${place.rating != null ? `
        <div class="rating-row">
          <span class="stars">${starGlyphs(place.rating)}</span>
          <span class="num">${place.rating.toFixed(1)}</span>
          <span class="count">(${place.reviewCount} Google ratings)</span>
          ${place.priceTier ? `<span class="price-tier">${place.priceTier}<span class="dim">${'$'.repeat(4-place.priceTier.length)}</span></span>` : ""}
        </div>
        <div class="rating-note">Google rating shown for reference — write your own review below.</div>
      ` : `<div class="rating-note">Not yet rated on Google — be the first to leave a review below.</div>`}
      ${place.tags && place.tags.length ? `
        <div class="context-tags">
          ${place.tags.map(t => `<span class="context-tag">${t}</span>`).join("")}
        </div>
      ` : ""}
    </div>
  `;

  const refWordForPlace = (baseKey === "camppendleton")
    ? (place.area === "south" ? "South Area" : "North Area")
    : cfg.refWord;

  const distText = place.dist === 0
    ? `On ${cfg.refWord === "post" ? "post" : "base"}`
    : cfg.unit === "mi"
      ? `${milesFrom(place.dist)} mi / ${place.dist.toFixed(1)} km from ${refWordForPlace}`
      : `${place.dist.toFixed(1)} km / ${milesFrom(place.dist)} mi from ${refWordForPlace}`;
  const dirUrl = `https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}`;
  const callHref = place.phone ? `tel:${place.phone.replace(/\s+/g,'')}` : null;

  document.getElementById("mainContent").innerHTML = `
    <p class="blurb-block">${place.blurb}</p>

    <div class="detail-grid">
      <div class="detail-card"><span class="ic">${fieldIcons.address}</span><div><div class="k">Address</div><div class="v">${place.addr}</div></div></div>
      <div class="detail-card"><span class="ic">${fieldIcons.distance}</span><div><div class="k">Distance from ${refWordForPlace}</div><div class="v">${distText}</div></div></div>
      <div class="detail-card"><span class="ic">${fieldIcons.hours}</span><div><div class="k">Hours</div><div class="v">${place.hours}</div></div></div>
      <div class="detail-card"><span class="ic">${fieldIcons.phoneField}</span><div><div class="k">Phone</div><div class="v">${place.phone ? place.phone : "Not listed"}</div></div></div>
    </div>

    <div class="action-row">
      <a class="action-btn primary" href="${dirUrl}" target="_blank" rel="noopener">Get directions →</a>
      ${callHref ? `<a class="action-btn" href="${callHref}">Call ${place.phone}</a>` : ""}
      <a class="action-btn" href="${cfg.hub}#feedback-section">Claim / report this listing</a>
    </div>

    <div id="reviews-section">
      <div class="section-label">Reviews from this site</div>
      <div id="reviewsList"><p class="no-reviews">Loading reviews…</p></div>
    </div>

    <div class="review-form">
      <div class="section-label" style="margin-bottom:16px;">Write a review</div>
      <form id="reviewForm">
        <div class="f-row">
          <label for="rName">Name (optional)</label>
          <input type="text" id="rName" placeholder="Your name">
        </div>
        <div class="f-row">
          <label for="rRating">Rating</label>
          <select id="rRating" required>
            <option value="">Select a rating</option>
            <option value="5">★★★★★ — Excellent</option>
            <option value="4">★★★★☆ — Good</option>
            <option value="3">★★★☆☆ — Okay</option>
            <option value="2">★★☆☆☆ — Not great</option>
            <option value="1">★☆☆☆☆ — Poor</option>
          </select>
        </div>
        <div class="f-row">
          <label for="rText">Your review</label>
          <textarea id="rText" placeholder="What should other families know?" required></textarea>
        </div>
        <button type="submit" class="f-submit" id="rSubmit">Post review</button>
        <div class="form-msg" id="rMsg"></div>
      </form>
    </div>
  `;

  async function loadReviews(){
    const listEl = document.getElementById("reviewsList");
    try {
      const res = await fetch(`/api/reviews?id=${encodeURIComponent(fullId)}`);
      const data = await res.json();
      const reviews = data.reviews || [];
      if(reviews.length === 0){
        listEl.innerHTML = `<p class="no-reviews">No reviews on this site yet — be the first to write one.</p>`;
        return;
      }
      listEl.innerHTML = reviews.map((r, i) => {
        if(r.removed){
          return `
            <div class="review-card removed-card">
              <p class="review-text removed-text">This review was removed for violating our content guidelines.</p>
            </div>
          `;
        }
        return `
        <div class="review-card">
          <div class="review-head">
            <span class="review-name">${escapeHtml(r.name || "Anonymous")}</span>
            <span class="review-date">${new Date(r.date).toLocaleDateString()}</span>
          </div>
          <div class="review-stars">${starGlyphs(r.rating)}</div>
          <p class="review-text">${escapeHtml(r.text)}</p>
          <button class="admin-remove-btn" data-date="${r.date}" onclick="showRemoveRow(${i})">Remove (admin)</button>
          <div class="admin-remove-row" id="removeRow${i}" style="display:none;">
            <input type="password" class="admin-pw-input" id="pw${i}" placeholder="Admin password">
            <button class="admin-confirm-btn" onclick="removeReview('${r.date}', ${i})">Confirm</button>
            <button class="admin-cancel-btn" onclick="hideRemoveRow(${i})">Cancel</button>
            <div class="admin-remove-msg" id="removeMsg${i}"></div>
          </div>
        </div>
      `;
      }).join("");
    } catch (err) {
      listEl.innerHTML = `<p class="no-reviews">Couldn't load reviews right now — try again in a moment.</p>`;
    }
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  window.showRemoveRow = function(i){
    document.getElementById(`removeRow${i}`).style.display = "flex";
    document.getElementById(`pw${i}`).focus();
  };

  window.hideRemoveRow = function(i){
    document.getElementById(`removeRow${i}`).style.display = "none";
  };

  window.removeReview = async function(date, i){
    const input = document.getElementById(`pw${i}`);
    const msgEl = document.getElementById(`removeMsg${i}`);
    const adminKey = input.value;
    if(!adminKey){
      msgEl.textContent = "Enter the admin password.";
      return;
    }
    msgEl.textContent = "Removing…";
    try {
      const res = await fetch("/api/reviews", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: fullId, date, adminKey })
      });
      const data = await res.json();
      if(!res.ok){
        msgEl.textContent = data.error || "Couldn't remove that review.";
        return;
      }
      loadReviews();
    } catch (err) {
      msgEl.textContent = "Couldn't reach the server — try again.";
    }
  };

  loadReviews();

  document.getElementById("reviewForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const submitBtn = document.getElementById("rSubmit");
    const msgEl = document.getElementById("rMsg");
    const name = document.getElementById("rName").value.trim();
    const rating = document.getElementById("rRating").value;
    const text = document.getElementById("rText").value.trim();

    if(!rating || !text){
      msgEl.textContent = "Please add a rating and a review.";
      msgEl.className = "form-msg error";
      return;
    }

    submitBtn.disabled = true;
    msgEl.textContent = "Posting…";
    msgEl.className = "form-msg";

    try {
      const res = await fetch("/api/reviews", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: fullId, name, rating, text })
      });
      const data = await res.json();
      if(!res.ok){
        msgEl.textContent = data.error || "Something went wrong — try again.";
        msgEl.className = "form-msg error";
      } else {
        msgEl.textContent = "Review posted — thank you!";
        msgEl.className = "form-msg ok";
        document.getElementById("reviewForm").reset();
        loadReviews();
      }
    } catch (err) {
      msgEl.textContent = "Couldn't reach the server — check your connection and try again.";
      msgEl.className = "form-msg error";
    }
    submitBtn.disabled = false;
  });
}
</script>
</body>
</html>
