<script>
const BASE_CONFIG = {
  ramstein: { label: "Ramstein", hub: "ramstein.html", dataFile: "data.js", refWord: "gate", unit: "km", timeZone: "Europe/Berlin" },
  fortbragg: { label: "Fort Bragg", hub: "fortbragg.html", dataFile: "data-fortbragg.js", refWord: "post", unit: "mi", timeZone: "America/New_York" },
  camppendleton: { label: "Camp Pendleton", hub: "camppendleton.html", dataFile: "data-camppendleton.js", refWord: "base", unit: "mi", timeZone: "America/Los_Angeles" },
  yokota: { label: "Yokota", hub: "yokota.html", dataFile: "data-yokota.js", refWord: "base", unit: "km", timeZone: "Asia/Tokyo" },
};

// ===== Open Now / Closed Now — parses the free-text hours field. Conservative
// by design: any format it can't confidently parse (prose, "by appointment",
// "varies", etc.) is simply skipped rather than risk showing wrong info. =====
const DAY_ABBR_MAP = {
  sun:0, sunday:0, mon:1, monday:1, tue:2, tues:2, tuesday:2, wed:3, wednesday:3,
  thu:4, thur:4, thurs:4, thursday:4, fri:5, friday:5, sat:6, saturday:6
};
function parseDayToken(token){
  token = token.trim().toLowerCase();
  return DAY_ABBR_MAP[token] !== undefined ? DAY_ABBR_MAP[token] : null;
}
function parseDaySpec(spec){
  spec = spec.trim().toLowerCase();
  if (spec === "daily" || spec === "every day" || spec === "open") return [0,1,2,3,4,5,6];
  const days = new Set();
  for (let part of spec.split(",")) {
    part = part.trim();
    if (!part) continue;
    if (part.includes("/")) {
      for (const sp of part.split("/")) {
        const d = parseDayToken(sp);
        if (d === null) return null;
        days.add(d);
      }
    } else if (/[–-]/.test(part)) {
      const rangeParts = part.split(/[–-]/).map(s=>s.trim()).filter(Boolean);
      if (rangeParts.length !== 2) return null;
      const start = parseDayToken(rangeParts[0]);
      const end = parseDayToken(rangeParts[1]);
      if (start === null || end === null) return null;
      let i = start;
      while (true) { days.add(i); if (i === end) break; i = (i + 1) % 7; }
    } else {
      const d = parseDayToken(part);
      if (d === null) return null;
      days.add(d);
    }
  }
  return Array.from(days);
}
function parseTimeToken(token){
  const m = token.trim().match(/^(\d{1,2})(?::(\d{2}))?$/);
  if (!m) return null;
  const hour = parseInt(m[1], 10);
  const minute = m[2] ? parseInt(m[2], 10) : 0;
  if (hour > 24 || minute > 59) return null;
  return hour * 60 + minute;
}
function parseTimeRanges(spec){
  const ranges = [];
  for (let group of spec.split(",")) {
    group = group.trim();
    if (!group) continue;
    const parts = group.split(/[–-]/).map(s => s.trim()).filter(Boolean);
    if (parts.length !== 2) return null;
    const start = parseTimeToken(parts[0]);
    let end = parseTimeToken(parts[1]);
    if (start === null || end === null) return null;
    if (end <= start) end += 24*60;
    ranges.push([start, end]);
  }
  return ranges.length ? ranges : null;
}
const HOURS_UNCERTAINTY_MARKERS = ["check ahead", "vary", "varies", "call ahead", "by booking", "by appointment", "by arrangement", "seasonal hours", "morning", "afternoon", "evening", "eve hours", "eve.", "contact for hours"];
function parseHoursString(hoursStr){
  if (!hoursStr) return null;
  let str = hoursStr.trim();
  const lowerStr = str.toLowerCase();
  for (const marker of HOURS_UNCERTAINTY_MARKERS) {
    if (lowerStr.includes(marker)) return null;
  }
  if (/^open 24 hours/i.test(str)) return { type: "always_open" };
  str = str.replace(/\([^)]*\)/g, "").trim();
  const groups = str.split(/\s*·\s*|\s+\.\s+/).map(g=>g.trim()).filter(Boolean);
  if (!groups.length) return null;
  const schedule = {};
  for (const group of groups) {
    const closedMatch = group.match(/^closed\s+(.+)$/i);
    if (closedMatch) {
      const dayIndices = parseDaySpec(closedMatch[1]);
      if (dayIndices === null) return null;
      for (const d of dayIndices) schedule[d] = [];
      continue;
    }
    const digitMatch = group.match(/\d/);
    if (!digitMatch) return null;
    const daySpec = group.slice(0, digitMatch.index).trim();
    const timeSpec = group.slice(digitMatch.index).trim();
    if (!daySpec) return null;
    const dayIndices = parseDaySpec(daySpec);
    if (dayIndices === null) return null;
    const timeRanges = parseTimeRanges(timeSpec);
    if (timeRanges === null) return null;
    for (const d of dayIndices) schedule[d] = (schedule[d] || []).concat(timeRanges);
  }
  return { type: "schedule", schedule };
}
function getNowInTimeZone(timeZone){
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone, hour12: false, weekday: "short", hour: "2-digit", minute: "2-digit"
  }).formatToParts(new Date());
  const dayMap = { sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6 };
  const weekday = parts.find(p => p.type === "weekday").value.toLowerCase().slice(0,3);
  const hour = parseInt(parts.find(p => p.type === "hour").value, 10);
  const minute = parseInt(parts.find(p => p.type === "minute").value, 10);
  return { day: dayMap[weekday], minutes: hour * 60 + minute };
}
function getOpenStatus(hoursStr, timeZone){
  const parsed = parseHoursString(hoursStr);
  if (!parsed) return null;
  if (parsed.type === "always_open") return true;
  const now = getNowInTimeZone(timeZone);
  const todayRanges = parsed.schedule[now.day];
  if (!todayRanges) return null;
  for (const [start, end] of todayRanges) {
    if (now.minutes >= start && now.minutes < end) return true;
  }
  const yesterday = (now.day + 6) % 7;
  const yesterdayRanges = parsed.schedule[yesterday];
  if (yesterdayRanges) {
    for (const [start, end] of yesterdayRanges) {
      if (end > 24*60 && now.minutes < end - 24*60) return true;
    }
  }
  return todayRanges.length === 0 ? false : false;
}

const SCHEMA_TYPE_MAP = {
  restaurant: "Restaurant", bars: "BarOrPub", grocery: "GroceryStore",
  shopping: "Store", farmers: "Store", furniture: "Store", tailor: "Store",
  cars: "AutomotiveBusiness", auto: "AutomotiveBusiness", phone: "Store",

  sandiego: "TouristAttraction", onsen: "TouristAttraction", outdoors: "TouristAttraction",
  beaches: "TouristAttraction", rec: "TouristAttraction", ski: "TouristAttraction",
  mountains: "TouristAttraction", coast: "TouristAttraction", pets: "Store", kids: "TouristAttraction",
};
const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function minutesToTimeStr(mins){
  const m = ((mins % (24*60)) + 24*60) % (24*60);
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}

function buildOpeningHoursSpec(hoursStr){
  const parsed = parseHoursString(hoursStr);
  if (!parsed) return undefined; // unparseable — omit rather than guess
  if (parsed.type === "always_open") {
    return [{ "@type": "OpeningHoursSpecification", dayOfWeek: DAY_NAMES, opens: "00:00", closes: "23:59" }];
  }
  const specs = [];
  for (const [dayIdx, ranges] of Object.entries(parsed.schedule)) {
    for (const [start, end] of ranges) {
      specs.push({
        "@type": "OpeningHoursSpecification",
        dayOfWeek: DAY_NAMES[dayIdx],
        opens: minutesToTimeStr(start),
        closes: minutesToTimeStr(end),
      });
    }
  }
  return specs.length ? specs : undefined;
}

function injectStructuredData(place, cfg, baseKey){
  const schemaType = SCHEMA_TYPE_MAP[place.cat] || "LocalBusiness";
  const data = {
    "@context": "https://schema.org",
    "@type": schemaType,
    name: place.name,
    description: place.blurb,
    address: { "@type": "PostalAddress", streetAddress: place.addr },
    geo: { "@type": "GeoCoordinates", latitude: place.lat, longitude: place.lng },
    url: window.location.origin + window.location.pathname + window.location.search,
  };
  if (place.phone) data.telephone = place.phone;
  if (place.rating != null && place.reviewCount) {
    data.aggregateRating = {
      "@type": "AggregateRating",
      ratingValue: place.rating,
      reviewCount: place.reviewCount,
      bestRating: 5,
      worstRating: 1,
    };
  }
  const hoursSpec = buildOpeningHoursSpec(place.hours);
  if (hoursSpec) data.openingHoursSpecification = hoursSpec;

  const script = document.createElement("script");
  script.type = "application/ld+json";
  script.textContent = JSON.stringify(data);
  document.head.appendChild(script);
}

        </div>
        <div class="f-row">
          <label for="rPhoto">Add a photo (optional)</label>
          <input type="file" id="rPhoto" accept="image/jpeg,image/png,image/webp" />
          <div id="rPhotoPreview" style="display:none; margin-top:8px;">
            <img id="rPhotoPreviewImg" style="max-width:160px; max-height:160px; border-radius:4px; border:1px solid var(--line);" />
            <button type="button" id="rPhotoRemove" class="action-btn" style="margin-top:6px; padding:4px 10px; font-size:11px;">Remove photo</button>
          </div>
        </div>
        <div id="turnstile-widget" style="margin-bottom:14px;"></div>
        <button type="submit" class="f-submit" id="rSubmit" disabled>Post review</button>
        <div class="form-msg" id="rMsg"></div>
      </form>
    </div>
  `;

  // Share / QR code
  const shareUrl = window.location.origin + window.location.pathname + window.location.search;
  const shareBtn = document.getElementById("shareBtn");
  const sharePopover = document.getElementById("sharePopover");
  const shareCloseBtn = document.getElementById("shareCloseBtn");
  const copyLinkBtn = document.getElementById("copyLinkBtn");
  const nativeShareBtn = document.getElementById("nativeShareBtn");
  let qrSucceeded = false;

  function showFallbackQrImage(){
    // A plain <img> pointing at a public QR-generation service — no JS
    // execution required on our end, so it works even if the in-browser
    // library above fails to load for any reason. Only used as a fallback:
    // this does send the listing's (already-public) URL to that service to
    // render the image, unlike the client-side method above.
    const qrCanvas = document.getElementById("qrCanvas");
    const qrCaption = document.querySelector(".qr-caption");
    const img = document.createElement("img");
    img.width = 200;
    img.height = 200;
    img.alt = "QR code for this listing";
    img.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(shareUrl);
    img.onload = () => { qrSucceeded = true; qrCaption.textContent = "Scan to open this listing on another phone"; };
    img.onerror = () => { qrCaption.textContent = "QR code couldn't load — use Copy Link above instead."; };
    qrCanvas.replaceWith(img);
    img.id = "qrCanvas";
  }

  function renderQrCode(){
    const qrCaption = document.querySelector(".qr-caption");
    if (window.qrLibFailed || typeof QRCode === "undefined") {
      showFallbackQrImage();
      return;
    }
    QRCode.toCanvas(document.getElementById("qrCanvas"), shareUrl, { width: 200, margin: 1 }, (err) => {
      if (err) {
        showFallbackQrImage();
      } else {
        qrSucceeded = true;
        qrCaption.textContent = "Scan to open this listing on another phone";
      }
    });
  }

  if (shareBtn) {
    shareBtn.addEventListener("click", () => {
      sharePopover.style.display = "flex";
      if (!qrSucceeded) {
        // Give the library a brief moment in case the click happens the instant
        // the page loads and the script hasn't finished executing yet.
        setTimeout(renderQrCode, typeof QRCode === "undefined" && !window.qrLibFailed ? 300 : 0);
      }
    });
  }
  if (shareCloseBtn) {
    shareCloseBtn.addEventListener("click", () => { sharePopover.style.display = "none"; });
  }
  if (sharePopover) {
    sharePopover.addEventListener("click", (e) => {
      if (e.target === sharePopover) sharePopover.style.display = "none";
    });
  }
  if (copyLinkBtn) {
    copyLinkBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(shareUrl);
        copyLinkBtn.textContent = "✓ Copied!";
        setTimeout(() => { copyLinkBtn.textContent = "📋 Copy link"; }, 2000);
      } catch {
        copyLinkBtn.textContent = "Couldn't copy — long-press the link bar instead";
      }
    });
  }
  if (nativeShareBtn && navigator.share) {
    nativeShareBtn.style.display = "inline-flex";
    nativeShareBtn.addEventListener("click", () => {
      navigator.share({ title: place.name, url: shareUrl }).catch(() => {});
    });
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && sharePopover) sharePopover.style.display = "none";
  });

  // "More in this category" sidebar
  const catMates = places
    .filter(p => p.cat === place.cat)
    .sort((a, b) => a.dist - b.dist);

  document.getElementById("sidebarContent").innerHTML = `
    <div class="section-label">More ${catLabels[place.cat]} Options</div>
    <p class="sidebar-note">Other ${catLabels[place.cat].toLowerCase()} listings near ${cfg.label}, closest first.</p>
    <div class="sidebar-list">
      ${catMates.map(p => {
        const isCurrent = p.id === place.id;
        const pDist = p.dist === 0 ? "On base" : `${p.dist.toFixed(1)} km`;
        return `
        <a class="sidebar-item ${isCurrent ? 'current' : ''}" href="${isCurrent ? '#' : `listing.html?base=${baseKey}&id=${p.id}`}">
          <span class="si-thumb" style="background:${catColors[p.cat] || '#3f5c6b'}22;">${icons[p.cat] || icons.attraction}</span>
          <span class="si-body">
            <span class="si-name">${p.name}</span>
            <span class="si-meta">
              ${p.rating != null ? `<span class="stars">${starGlyphs(p.rating)}</span><span>${p.rating.toFixed(1)}</span>` : ""}
              <span class="si-dist">${pDist}</span>
            </span>
          </span>
          ${isCurrent ? `<span class="si-viewing">viewing</span>` : ""}
        </a>`;
      }).join("")}
    </div>
  `;

  async function loadReviews(){
    const listEl = document.getElementById("reviewsList");
    try {
      const res = await fetch(`/api/reviews?id=${encodeURIComponent(fullId)}`);
      const data = await res.json();
      const reviews = data.reviews || [];
      if(reviews.length === 0){
        listEl.innerHTML = `<p class="no-reviews">No reviews on this site yet — be the first to write one.</p>`;
        return;
      }
      listEl.innerHTML = reviews.map((r, i) => {
        if(r.removed){
          return `
            <div class="review-card removed-card">
              <p class="review-text removed-text">This review was removed for violating our content guidelines.</p>
            </div>
          `;
        }
        return `
        <div class="review-card">
          <div class="review-head">
            <span class="review-name">${escapeHtml(r.name || "Anonymous")}</span>
            <span class="review-date">${new Date(r.date).toLocaleDateString()}</span>
          </div>
          <div class="review-stars">${starGlyphs(r.rating)}</div>
          <p class="review-text">${escapeHtml(r.text)}</p>
          ${r.photoKey ? `<img class="review-photo" src="/api/photo/${encodeURIComponent(r.photoKey)}" alt="Photo from ${escapeHtml(r.name || "Anonymous")}'s review" loading="lazy" onclick="openLightbox(this.src)" />` : ""}
          <button class="admin-remove-btn" data-date="${r.date}" onclick="showRemoveRow(${i})">Remove (admin)</button>
          <div class="admin-remove-row" id="removeRow${i}" style="display:none;">
            <input type="password" class="admin-pw-input" id="pw${i}" placeholder="Admin password">
            <button class="admin-confirm-btn" onclick="removeReview('${r.date}', ${i})">Confirm</button>
            <button class="admin-cancel-btn" onclick="hideRemoveRow(${i})">Cancel</button>
            <div class="admin-remove-msg" id="removeMsg${i}"></div>
          </div>
        </div>
      `;
      }).join("");
    } catch (err) {
      listEl.innerHTML = `<p class="no-reviews">Couldn't load reviews right now — try again in a moment.</p>`;
    }
  }

  window.openLightbox = function(src){
    const overlay = document.createElement("div");
    overlay.className = "lightbox-overlay";
    overlay.innerHTML = `<img src="${src}" alt="Enlarged review photo" />`;
    overlay.addEventListener("click", () => overlay.remove());
    document.addEventListener("keydown", function esc(e){
      if(e.key === "Escape"){ overlay.remove(); document.removeEventListener("keydown", esc); }
    });
    document.body.appendChild(overlay);
  };

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  window.showRemoveRow = function(i){
    document.getElementById(`removeRow${i}`).style.display = "flex";
    document.getElementById(`pw${i}`).focus();
  };

  window.hideRemoveRow = function(i){
    document.getElementById(`removeRow${i}`).style.display = "none";
  };

  window.removeReview = async function(date, i){
    const input = document.getElementById(`pw${i}`);
    const msgEl = document.getElementById(`removeMsg${i}`);
    const adminKey = input.value;
    if(!adminKey){
      msgEl.textContent = "Enter the admin password.";
      return;
    }
    msgEl.textContent = "Removing…";
    try {
      const res = await fetch("/api/reviews", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: fullId, date, adminKey })
      });
      const data = await res.json();
      if(!res.ok){
        msgEl.textContent = data.error || "Couldn't remove that review.";
        return;
      }
      loadReviews();
    } catch (err) {
      msgEl.textContent = "Couldn't reach the server — try again.";
    }
  };

  loadReviews();

  // Turnstile enables the submit button only once the challenge is solved.
  // The widget div is inserted dynamically (as part of mainContent's innerHTML),
  // so we render it explicitly rather than relying on Turnstile's automatic
  // page-scan, which can miss elements added after the script first loads.
  // We poll rather than relying on Cloudflare's ?onload= callback, since that
  // callback can fire before this code has even defined it (a race condition
  // depending on how long the async data fetch above takes) — polling can't
  // miss the signal the way a one-shot callback can.
  window.onTurnstileSuccess = function(){
    document.getElementById("rSubmit").disabled = false;
  };

  window.turnstileWidgetId = null;
  function tryRenderTurnstile(){
    if (window.turnstileWidgetId !== null) return; // already rendered
    const el = document.getElementById("turnstile-widget");
    if (el && typeof turnstile !== "undefined" && turnstile.render) {
      window.turnstileWidgetId = turnstile.render(el, {
        sitekey: "0x4AAAAAAES5Rg7OaO37hy9p",
        callback: window.onTurnstileSuccess,
      });
    } else {
      setTimeout(tryRenderTurnstile, 150);
    }
  }
  tryRenderTurnstile();

  // Photo selection + preview
  let selectedPhotoBlob = null;
  const rPhotoInput = document.getElementById("rPhoto");
  const rPhotoPreview = document.getElementById("rPhotoPreview");
  const rPhotoPreviewImg = document.getElementById("rPhotoPreviewImg");
  const rPhotoRemove = document.getElementById("rPhotoRemove");

  async function compressPhoto(file){
    const MAX_DIMENSION = 1200;
    const QUALITY = 0.8;
    const objectUrl = URL.createObjectURL(file);
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = objectUrl;
    });
    let { width, height } = img;
    if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
      if (width > height) { height = Math.round(height * (MAX_DIMENSION / width)); width = MAX_DIMENSION; }
      else { width = Math.round(width * (MAX_DIMENSION / height)); height = MAX_DIMENSION; }
    }
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    canvas.getContext("2d").drawImage(img, 0, 0, width, height);
    URL.revokeObjectURL(objectUrl);
    return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", QUALITY));
  }

  if (rPhotoInput) {
    rPhotoInput.addEventListener("change", async () => {
      const file = rPhotoInput.files[0];
      if (!file) return;
      try {
        selectedPhotoBlob = await compressPhoto(file);
        rPhotoPreviewImg.src = URL.createObjectURL(selectedPhotoBlob);
        rPhotoPreview.style.display = "block";
      } catch {
        selectedPhotoBlob = null;
        document.getElementById("rMsg").textContent = "Couldn't process that photo — try a different one.";
        document.getElementById("rMsg").className = "form-msg error";
      }
    });
  }
  if (rPhotoRemove) {
    rPhotoRemove.addEventListener("click", () => {
      selectedPhotoBlob = null;
      rPhotoInput.value = "";
      rPhotoPreview.style.display = "none";
    });
  }

  document.getElementById("reviewForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const submitBtn = document.getElementById("rSubmit");
    const msgEl = document.getElementById("rMsg");
    const name = document.getElementById("rName").value.trim();
    const rating = document.getElementById("rRating").value;
    const text = document.getElementById("rText").value.trim();
    const turnstileToken = (typeof turnstile !== "undefined" && window.turnstileWidgetId !== null) ? turnstile.getResponse(window.turnstileWidgetId) : "";

    if(!rating || !text){
      msgEl.textContent = "Please add a rating and a review.";
      msgEl.className = "form-msg error";
      return;
    }
    if(!turnstileToken){
      msgEl.textContent = "Please complete the verification challenge above.";
      msgEl.className = "form-msg error";
      return;
    }

    submitBtn.disabled = true;
    msgEl.textContent = "Posting…";
    msgEl.className = "form-msg";

    try {
      const formData = new FormData();
      formData.append("id", fullId);
      formData.append("name", name);
      formData.append("rating", rating);
      formData.append("text", text);
      formData.append("turnstileToken", turnstileToken);
      if (selectedPhotoBlob) formData.append("photo", selectedPhotoBlob, "review-photo.jpg");

      const res = await fetch("/api/reviews", { method: "POST", body: formData });
      const data = await res.json();
      if(!res.ok){
        msgEl.textContent = data.error || "Something went wrong — try again.";
        msgEl.className = "form-msg error";
        if(typeof turnstile !== "undefined" && window.turnstileWidgetId !== null) turnstile.reset(window.turnstileWidgetId);
        submitBtn.disabled = true;
      } else {
        msgEl.textContent = "Review posted — thank you!";
        msgEl.className = "form-msg ok";
        document.getElementById("reviewForm").reset();
        selectedPhotoBlob = null;
        rPhotoPreview.style.display = "none";
        if(typeof turnstile !== "undefined" && window.turnstileWidgetId !== null) turnstile.reset(window.turnstileWidgetId);
        submitBtn.disabled = true;
        loadReviews();
      }
    } catch (err) {
      msgEl.textContent = "Couldn't reach the server — check your connection and try again.";
      msgEl.className = "form-msg error";
    }
  });
}
</script>
</body>
</html>
